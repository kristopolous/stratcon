<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StratCon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --bg:#0b0d10; --panel:#11141a; --line:#1f242d; --text:#e6e9ef; --dim:#8a93a3; --faint:#4a5160;
  --yes:#3ddc97; --no:#5b6472; --gap:#f5b445; --crit:#a78bfa; --sponsor:#f59e5b; --speaker:#5bc6f5; --ev:#ffffff;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:340px 1fr 380px;grid-template-rows:48px 1fr 30px;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line)}
header b{font-size:16px;letter-spacing:.02em}
header span{color:var(--dim);font-size:13px}
#status{grid-column:1/4;border-top:1px solid var(--line);font:12px var(--mono);color:var(--dim);padding:6px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.busy::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gap);margin-right:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}

/* conversation */
.chat{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.u{align-self:flex-end;background:#1d2b4a;padding:9px 12px;border-radius:12px 12px 2px 12px;max-width:92%}
.a{display:flex;flex-direction:column;gap:6px}
.a .model{font:11px var(--mono);color:var(--faint)}
.tool{font:12px var(--mono);background:#151a22;border:1px solid var(--line);border-left:3px solid var(--crit);padding:5px 8px;border-radius:4px;color:#cfd5e0;animation:in .4s}
.tool .fn{color:var(--crit)}
.tool.rm{border-left-color:#e5636b}.tool.rm .fn{color:#e5636b}
.tool.rw{border-left-color:var(--gap)}.tool.rw .fn{color:var(--gap)}
.reply{color:var(--dim);font-size:13px}
.thinking{font:12px var(--mono);color:var(--faint)}
.compose{padding:12px;border-top:1px solid var(--line)}
.sugg{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sugg button{background:none;border:1px dashed #2c3340;color:var(--dim);text-align:left;padding:6px 10px;border-radius:6px;font:12px Inter;cursor:pointer}
.sugg .sg{font:10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.sugg button:hover{color:var(--text);border-color:var(--crit)}
#q{width:100%;background:#0e1116;border:1px solid #2a303b;color:var(--text);padding:11px 12px;border-radius:8px;font:14px Inter;outline:none}
#q:focus{border-color:var(--crit)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

/* matrix */
.board{display:flex;flex-direction:column;min-width:0;min-height:0}
.thead,.row{display:grid;align-items:center}
.thead{padding:10px 16px 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);gap:8px}
.ch{display:flex;flex-direction:column;gap:5px;animation:in .5s}
.ch .t{color:var(--text);font-weight:500;font-size:12.5px;line-height:1.25;height:32px;overflow:hidden}
.ch .w{height:4px;background:#1c212a;border-radius:2px;overflow:hidden}
.ch .w i{display:block;height:100%;background:var(--crit);transition:width .8s}
.ch.neg .w i{background:#e5636b}
#rows{position:relative;flex:1;overflow-y:auto;overflow-x:hidden}
.row{position:absolute;left:0;right:0;height:var(--rh);padding:0 16px;gap:8px;border-bottom:1px solid #161a21;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
.row .rk{font:600 13px var(--mono);color:var(--faint)}
.row.top .rk{color:var(--text)}
.ent .n{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ent .m{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .why{font-size:11.5px;color:var(--yes);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.ent{display:flex;align-items:center;gap:10px;min-width:0}
.ent .txt{min-width:0}
.logo{flex:none;width:58px;height:26px;border-radius:4px;object-fit:cover;background:#1a1f27}
.logo.person{width:34px;height:34px;border-radius:50%;object-fit:cover}
.score{font:600 15px var(--mono);text-align:right}
.score small{display:block;font:11px var(--mono);color:var(--faint)}

.cell{height:calc(var(--rh) - 14px);border-radius:6px;background:#12161c;position:relative;overflow:hidden;cursor:default;font:12px var(--mono);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 7px}
.cell .bar{position:absolute;left:0;bottom:0;top:0;background:linear-gradient(90deg,rgba(61,220,151,.10),rgba(61,220,151,.30));transition:width 1s cubic-bezier(.2,.8,.2,1);border-right:2px solid var(--yes)}
.cell.low .bar{background:rgba(91,100,114,.18);border-right-color:var(--no)}
.cell .v{position:relative;font-weight:500}
.cell .tag{position:relative;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.mem{box-shadow:inset 0 0 0 1px rgba(167,139,250,.6)}
.cell.gap{background:repeating-linear-gradient(135deg,#1a1508 0 6px,#231c0a 6px 12px);box-shadow:inset 0 0 0 1px var(--gap);animation:gapp 1.6s infinite}
.cell.gap .bar{display:none}
.cell.gap .v{color:var(--gap)}
@keyframes gapp{50%{box-shadow:inset 0 0 0 1px rgba(245,180,69,.3)}}
.cell.route,.cell.fetch{background:#17140c;box-shadow:inset 0 0 0 1px var(--gap)}
.cell.route .bar,.cell.fetch .bar{display:none}
.strat{position:relative;display:flex;flex-direction:column;gap:2px}
.strat div{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
.strat div i{display:block;height:5px;background:#3a3220;border-radius:2px;min-width:2px}
.strat div.win{color:var(--gap)}
.strat div.win i{background:var(--gap)}
.cell.fetch .tag{color:var(--gap);white-space:normal;line-height:1.25;max-height:2.6em}
.cell.fetch::after{content:"";position:absolute;left:-40%;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(245,180,69,.15),transparent);animation:sweep 1.1s infinite}
@keyframes sweep{to{left:100%}}
.cell.evid{cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.cell .delta{position:absolute;top:5px;right:6px;font-size:11px;font-weight:600}
.cell .delta.up{color:var(--yes)}.cell .delta.dn{color:#e5636b}
.cell.fail{box-shadow:inset 0 0 0 1px #e5636b}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;text-align:center;padding:40px}

/* graph + trace */
.side{border-left:1px solid var(--line);display:grid;grid-template-rows:1fr 42%;min-height:0}
#graph{position:relative;min-height:0}
#graph svg{width:100%;height:100%}
#graph .cap{position:absolute;left:12px;top:10px;font:11px var(--mono);color:var(--faint);pointer-events:none}
#trace{border-top:1px solid var(--line);overflow-y:auto;padding:8px 12px;font:11px/1.5 var(--mono);color:var(--dim)}
#trace div{padding:3px 0;border-bottom:1px solid #151920;animation:in .3s}
#trace .k{display:inline-block;min-width:76px;color:var(--faint)}
#trace .k.bd{color:var(--gap)}#trace .k.fk{color:#7aa2ff}#trace .k.s1{color:var(--yes)}#trace .k.ag{color:var(--crit)}
#trace code{color:#9fb0c8;white-space:pre-wrap;word-break:break-word}

/* drawer */
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
#drawer.on{display:flex}
#drawer .box{width:min(640px,92vw);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
#drawer h3{font-size:15px;margin-bottom:4px}
#drawer .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
#drawer blockquote{border-left:3px solid var(--yes);padding:8px 12px;background:#0e1215;font-size:13px;color:#cdd3dc;margin:10px 0}
#drawer .calls div{font:12px var(--mono);color:var(--dim);padding:3px 0}
#drawer a{color:#7aa2ff}
</style>
</head>
<body>
<div class="app">
  <header><b>StratCon</b><span id="meta">GitHub Universe 2026</span><span id="clock" style="margin-left:auto;font:12px var(--mono);color:var(--gap)"></span></header>

  <section class="chat">
    <div id="log"></div>
    <div class="compose">
      <div class="sugg" id="sugg">
        <div class="sg">start with</div>
        <button>Coding agents keep breaking our CI/CD pipelines and builds take forever.</button>
        <button>We ship AI-written code nobody understands. I need debugging and code comprehension.</button>
        <button>We need isolated sandboxes to safely run and test what our agents generate.</button>
        <div class="sg">then</div>
        <button>Actually, that matters less now. Supply chain security is the priority.</button>
        <button>Which talks should I go to for this?</button>
        <button>It's Wednesday 2pm and I'm at the conference. What now?</button>
        <button>Put my plan in my calendar.</button>
      </div>
      <input id="q" placeholder="What are you here for?" autocomplete="off">
    </div>
  </section>

  <section class="board">
    <div class="thead" id="thead"></div>
    <div id="rows"><div class="empty" id="empty">Tell it what you're working on.<br>Every sponsor booth, talk and speaker at GitHub Universe gets scored against what you say.</div></div>
  </section>

  <section class="side">
    <div id="graph"><div class="cap" id="gcap">graph</div></div>
    <div id="trace"></div>
  </section>

  <div id="status">ready</div>
</div>
<div id="drawer"><div class="box" id="dbox"></div></div>

<script>
const RH = 66, SHOW = 12;
document.documentElement.style.setProperty('--rh', RH + 'px');
const sid = 's' + Math.random().toString(36).slice(2, 9);
const E = {}; let crits = [], rank = [], cells = {}, rowEls = {}, busy = false, t0 = 0, tfBox = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host = u => { try { return new URL(u).host.replace(/^www\./, ''); } catch { return u || ''; } };
const STRAT = {web_search: 'search', read_site: 'read site', render_browser: 'render', people_search: 'people'};

fetch('/api/entities').then(r => r.json()).then(list => {
  list.forEach(e => E[e.id] = e);
  const n = k => list.filter(e => e.kind === k).length;
  $('#meta').textContent = `GitHub Universe 2026 · ${n('sponsor')} sponsor booths · ${n('talk')} talks · ${n('speaker')} featured speakers`;
});

function status(t, b) { $('#status').textContent = t; $('#status').classList.toggle('busy', !!b); }
function trace(k, cls, html) {
  const d = document.createElement('div');
  d.innerHTML = `<span class="k ${cls}">${k}</span>${html}`;
  $('#trace').prepend(d);
  while ($('#trace').children.length > 120) $('#trace').lastChild.remove();
}
function chat(html, cls) {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html;
  $('#log').append(d); $('#log').scrollTop = 1e9; return d;
}

function cols() { return `34px minmax(170px,1.4fr) 62px ${crits.map(() => 'minmax(104px,1fr)').join(' ')}`; }
function renderHead() {
  $('#thead').style.gridTemplateColumns = cols();
  $('#thead').innerHTML = `<div>#</div><div>recommendation</div><div style="text-align:right">score</div>` +
    crits.map(c => `<div class="ch ${c.weight < 0 ? 'neg' : ''}" title="${esc(c.text)}"><div class="t">${esc(c.text)}</div>
      <div class="w"><i style="width:${Math.abs(c.weight) * 100}%"></i></div></div>`).join('');
}

function cellHTML(eid, c) {
  const x = cells[eid + '|' + c.id];
  if (!x) return `<div class="cell"><span class="tag" style="color:var(--faint)">·</span></div>`;
  const p = x.p ?? 0, pct = (p * 100).toFixed(0);
  if (x.state === 'gap') return `<div class="cell gap"><span class="v">? ${p.toFixed(2)}</span><span class="tag">could change the ranking</span></div>`;
  if (x.state === 'route') {
    const rows = Object.entries(x.probs || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      `<div class="${k === x.chosen ? 'win' : ''}"><i style="width:${Math.max(2, v * 60)}px"></i>${STRAT[k] || k} ${v.toFixed(2)}</div>`).join('');
    return `<div class="cell route"><div class="strat">${rows}</div></div>`;
  }
  if (x.state === 'fetch') return `<div class="cell fetch"><span class="v" style="color:var(--gap)">? ${p.toFixed(2)}</span><span class="tag">${esc(x.doing)}</span></div>`;
  const cls = ['cell', p < .5 ? 'low' : '', x.src === 'memory' && x.fresh ? 'mem' : '', x.evidence ? 'evid' : '', x.state === 'fail' ? 'fail' : ''].join(' ');
  const delta = x.before != null ? `<span class="delta ${p >= x.before ? 'up' : 'dn'}">${p >= x.before ? '+' : ''}${(p - x.before).toFixed(2)}</span>` : '';
  const tag = x.evidence ? `${host(x.evidence.url) || x.evidence.product}` : x.src === 'memory' && x.fresh ? 'from graph' : x.state === 'fail' ? 'unresolved' : '';
  return `<div class="${cls}" data-k="${eid}|${c.id}"><div class="bar" style="width:${x.anim ?? pct}%"></div>${delta}
    <span class="v">${p.toFixed(2)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</div>`;
}

function because(eid) {
  let best = null;
  crits.forEach(c => { const x = cells[eid + '|' + c.id]; if (x && c.weight > 0 && x.p >= .6) { const s = c.weight * x.p; if (!best || s > best.s) best = {s, c, x}; } });
  if (!best) return '';
  const src = best.x.evidence ? ` — ${host(best.x.evidence.url) || best.x.evidence.product}` : '';
  return `because: ${best.c.text.toLowerCase()} (${best.x.p.toFixed(2)}${src})`;
}

let raf = 0;
function render() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; doRender(); }); }
function doRender() {
  const box = $('#rows');
  $('#empty').style.display = crits.length ? 'none' : 'flex';
  const top = rank.filter(r => r.score > 0 || crits.some(c => cells[r.id + '|' + c.id])).slice(0, SHOW);
  const keep = new Set(top.map(r => r.id));
  Object.keys(rowEls).forEach(id => { if (!keep.has(id)) { const el = rowEls[id]; el.style.opacity = 0; setTimeout(() => el.remove(), 500); delete rowEls[id]; } });
  top.forEach((r, i) => {
    let el = rowEls[r.id];
    if (!el) { el = document.createElement('div'); el.className = 'row'; el.style.transform = `translateY(${(i + 2) * RH}px)`; el.style.opacity = 0; box.append(el); rowEls[r.id] = el; requestAnimationFrame(() => el.style.opacity = 1); }
    const e = E[r.id] || {name: r.id};
    el.classList.toggle('top', i < 3);
    el.style.gridTemplateColumns = cols();
    el.style.transform = `translateY(${i * RH}px)`;
    el.innerHTML = `<div class="rk">${i + 1}</div>
      <div class="ent">${e.logo ? `<img class="logo ${e.kind === 'speaker' ? 'person' : ''}" src="${esc(e.logo)}" alt="" loading="lazy">` : ''}<div class="txt"><div class="n"><span class="dot" style="background:${e.kind === 'speaker' ? 'var(--speaker)' : e.kind === 'talk' ? 'var(--crit)' : 'var(--sponsor)'}"></span>${esc(e.name)}</div>
      ${i < 3 && because(r.id) ? `<div class="why">${esc(because(r.id))}</div>` : `<div class="m">${esc(e.kind === 'speaker' ? e.org + ' · speaker' : e.kind === 'talk' ? (e.when || '') + (e.room ? ' · ' + e.room : '') : e.tier + ' sponsor')}</div>`}</div></div>
      <div class="score">${(r.score * 100).toFixed(0)}</div>` + crits.map(c => cellHTML(r.id, c)).join('');
  });
  box.style.minHeight = top.length * RH + 'px';
}

$('#rows').addEventListener('click', ev => {
  const c = ev.target.closest('.cell.evid'); if (!c) return;
  const [eid, cid] = c.dataset.k.split('|'), x = cells[c.dataset.k], cr = crits.find(k => k.id === cid), e = E[eid];
  $('#dbox').innerHTML = `<h3>${esc(e.name)} — ${esc(cr?.text)}</h3>
    <div class="sub">${x.before != null ? `${x.before.toFixed(2)} → ` : ''}<b>${x.p.toFixed(2)}</b> after reading evidence · re-scored by clef-flash</div>
    <blockquote>${esc(x.evidence.snippet)}</blockquote>
    <div class="sub">source: <a href="${esc(x.evidence.url)}" target="_blank">${esc(x.evidence.url)}</a></div>
    <div class="calls">${(x.calls || []).map(k => `<div>${esc(k.product)} · ${esc(k.target)} · ${(k.ms / 1000).toFixed(1)}s · ${(k.bytes / 1024).toFixed(0)} KB</div>`).join('')}</div>`;
  $('#drawer').classList.add('on');
});
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') e.currentTarget.classList.remove('on'); });

/* ---------- graph ---------- */
const svg = d3.select('#graph').append('svg');
const gl = svg.append('g'), gn = svg.append('g');
const sim = d3.forceSimulation().force('link', d3.forceLink().id(d => d.id).distance(l => l.kind === 'evidence' ? 28 : l.kind === 'wants' ? 70 : 60))
  .force('charge', d3.forceManyBody().strength(-160)).force('collide', d3.forceCollide(16)).alphaDecay(.03);
let gnodes = [], glinks = [], gtimer = 0;
const color = k => ({user: '#fff', criterion: 'var(--crit)', sponsor: 'var(--sponsor)', speaker: 'var(--speaker)', evidence: '#ddd'}[k] || '#888');
function refreshGraph() { clearTimeout(gtimer); gtimer = setTimeout(loadGraph, 500); }
async function loadGraph() {
  const g = await (await fetch('/api/graph?sid=' + sid)).json();
  const old = Object.fromEntries(gnodes.map(n => [n.id, n]));
  const r = $('#graph').getBoundingClientRect();
  sim.force('center', d3.forceCenter(r.width / 2, r.height / 2));
  gnodes = g.nodes.map(n => Object.assign(old[n.id] || {x: r.width / 2 + (Math.random() - .5) * 40, y: r.height / 2 + (Math.random() - .5) * 40}, n));
  glinks = g.links.map(l => ({...l}));
  $('#gcap').textContent = `FalkorDB · ${gnodes.length} nodes · ${glinks.length} edges · ${g.ms}ms`;
  const L = gl.selectAll('line').data(glinks, d => d.source + '>' + d.target);
  L.exit().remove();
  L.enter().append('line').attr('stroke', d => d.kind === 'evidence' ? '#ddd' : d.kind === 'wants' ? '#5b4b8a' : '#2f6b52')
    .attr('stroke-width', d => d.kind === 'scored' ? 1 + 3 * (d.p - .5) * 2 : 1).attr('stroke-opacity', .8);
  const N = gn.selectAll('g').data(gnodes, d => d.id);
  N.exit().remove();
  const ne = N.enter().append('g');
  ne.append('circle').attr('r', d => d.kind === 'user' ? 9 : d.kind === 'evidence' ? 3.5 : d.kind === 'criterion' ? 7 : 6)
    .attr('fill', d => color(d.kind)).attr('opacity', 0).transition().duration(600).attr('opacity', 1);
  ne.append('text').attr('x', 9).attr('y', 3.5).attr('fill', '#9aa3b2').attr('font-size', d => d.kind === 'evidence' ? 8.5 : 10)
    .attr('font-family', 'Inter').text(d => d.kind === 'criterion' ? d.label.slice(0, 26) + (d.label.length > 26 ? '…' : '') : d.label);
  sim.nodes(gnodes).on('tick', () => {
    gl.selectAll('line').attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    gn.selectAll('g').attr('transform', d => `translate(${d.x},${d.y})`);
  });
  sim.force('link').links(glinks);
  sim.alpha(.7).restart();
}

/* ---------- events ---------- */
function setCell(e, c, patch) { const k = e + '|' + c; cells[k] = Object.assign(cells[k] || {}, patch); }
function handle(ev) {
  const s = ((ev.t - t0)).toFixed(1) + 's';
  switch (ev.type) {
    case 'agent':
      if (ev.phase === 'start' && ev.via) {
        tfBox = chat(`<span class="model">${esc(ev.via)} agent · ${esc(ev.model)}</span><span class="thinking">thinking…</span>`, 'a');
        status(`${ev.via}: ${ev.model} deciding which rubric tools to call`, 1); break;
      }
      if (ev.phase === 'start') { chat(`<span class="thinking">${esc(ev.model)} editing the rubric…</span>`, 'a pending'); status(`${ev.model}: turning what you said into rubric edits`, 1); break; }
      if (ev.via && tfBox) {
        tfBox.querySelector('.thinking')?.remove();
        tfBox.querySelector('.model').textContent = `${ev.via} agent · ${ev.model} · ${(ev.ms / 1000).toFixed(1)}s`;
        tfBox.insertAdjacentHTML('beforeend', `<div class="reply">${esc(ev.reply)}</div>`);
        trace(s, 'ag', `${esc(ev.via)} turn ${esc(ev.status)} · ${(ev.ops || []).length} tool calls executed (${ev.ms}ms)`);
        tfBox = null; break;
      }
      document.querySelector('.a.pending')?.remove();
      chat(`<span class="model">${esc(ev.model)} · ${(ev.ms / 1000).toFixed(1)}s</span>` + (ev.ops || []).map(o =>
        o.op === 'add' ? `<div class="tool"><span class="fn">add_criterion</span>("${esc(o.text)}", ${o.weight})</div>` :
        o.op === 'remove' ? `<div class="tool rm"><span class="fn">remove_criterion</span>("${esc(crits.find(c => c.id === o.id)?.text || o.id)}")</div>` :
        o.op === 'reweight' ? `<div class="tool rw"><span class="fn">reweight</span>("${esc(crits.find(c => c.id === o.id)?.text || o.id)}", ${crits.find(c => c.id === o.id)?.weight} → ${o.weight})</div>` :
        o.op === 'clock' ? `<div class="tool rw"><span class="fn">set_clock</span>("${esc(o.value)}")</div>` :
        o.op === 'calendar' ? `<div class="tool"><span class="fn">export_calendar</span>()</div>` :
        `<div class="tool"><span class="fn">set_scope</span>("${esc(o.value)}")</div>`).join('') + `<div class="reply">${esc(ev.reply)}</div>`, 'a');
      trace(s, 'ag', `${esc(ev.model)} → ${(ev.ops || []).length} tool calls (${ev.ms}ms)`);
      break;
    case 'tf_session': trace(s, 'ag', `TrueForge session ${esc(ev.id)} (${ev.ms}ms)`); break;
    case 'tf_mcp': trace(s, 'ag', `TrueForge connected MCP: ${esc(ev.servers.join(', '))}`); break;
    case 'tf_tool_call': {
      let a = {}; try { a = JSON.parse(ev.args || '{}'); } catch {}
      const label = id => esc(crits.find(c => c.id === id)?.text || id);
      const body = ev.name === 'add_criterion' ? `"${esc(a.text)}", ${a.weight}` : ev.name === 'reweight' ? `"${label(a.criterion_id)}", ${crits.find(c => c.id === a.criterion_id)?.weight ?? '?'} → ${a.weight}` :
        ev.name === 'remove_criterion' ? `"${label(a.criterion_id)}"` : ev.name === 'set_scope' ? `"${esc(a.scope)}"` : '';
      const cls = ev.name === 'remove_criterion' ? 'rm' : ev.name === 'reweight' ? 'rw' : '';
      (tfBox || chat('', 'a')).insertAdjacentHTML('beforeend', `<div class="tool ${cls}" data-call="${esc(ev.id)}"><span class="fn">${esc(ev.name)}</span>(${body}) <span class="ok" style="color:var(--faint)">…</span></div>`);
      trace(s, 'ag', `TrueForge tool_call ${esc(ev.name)} ${esc(ev.args || '')}`);
      break;
    }
    case 'tf_tool_result': {
      const el = document.querySelector(`.tool[data-call="${CSS.escape(ev.id)}"] .ok`);
      if (el) { el.textContent = '✓ via MCP'; el.style.color = 'var(--yes)'; }
      trace(s, 'ag', `tool.response ${esc(ev.content.slice(0, 120))}`);
      break;
    }
    case 'clock':
      $('#clock').textContent = `conference clock: ${ev.label}`;
      trace(s, 'ag', `clock → ${esc(ev.label)} · ${ev.hidden} talks already happened, dropped from the plan`);
      status(`it's ${ev.label}: ${ev.hidden} talks are over, re-planning around what's left`, 1);
      break;
    case 'calendar':
      chat(`<div class="tool" style="border-left-color:var(--yes)"><span class="fn" style="color:var(--yes)">export_calendar</span>() → <a href="${esc(ev.url)}" style="color:#7aa2ff">stratcon-universe-2026.ics</a></div>` +
        ev.items.map(i => `<div class="reply">${esc(i.start)} · ${esc(i.title)}${i.where ? ' · ' + esc(i.where) : ''}</div>`).join(''), 'a');
      trace(s, 'ag', `calendar: ${ev.items.length} events`);
      break;
    case 'rubric': crits = ev.criteria; renderHead(); render(); break;
    case 'reweight': trace(s, 'ag', `reweight ${esc(ev.crit)} ${ev.before} → ${ev.after}`); break;
    case 'rank': rank = ev.rows; render(); break;
    case 'note': status(ev.text); trace(s, 's1', esc(ev.text)); break;
    case 'fill': status(`scoring the rest of the row for ${ev.n} new leaders`, 1); trace(s, 's1', `fill in: ${esc(ev.names.join(', '))}`); break;
    case 'memory': status(`recalled ${ev.n} scores from the graph`); trace(s, 'fk', `memory hit: ${ev.n} scores reused (${ev.ms}ms)<br><code>${esc(ev.cypher)}</code>`); break;
    case 'retrieval': {
      const ct = crits.find(c => c.id === ev.crit)?.text || ev.crit;
      if (ev.phase === 'start') { status(`${ev.model}: one pass over all ${ev.n} sponsors & speakers — "${ct}"`, 1); break; }
      trace(s, 's1', `${ev.model} choice over ${ev.n} · "${esc(ct)}" (${ev.ms}ms)<br>` +
        ev.top.map(([n, p]) => `<span style="display:inline-block;margin-right:8px"><i style="display:inline-block;height:6px;width:${Math.max(2, p * 70)}px;background:var(--yes);margin-right:3px"></i>${esc(n)} ${p.toFixed(2)}</span>`).join(''));
      break;
    }
    case 'candidates': status(`${ev.total} in graph → ${ev.kept} candidates to score`, 1); trace(s, 'fk', `retrieve ${ev.kept}/${ev.total}: ${esc(ev.names.slice(0, 6).join(', '))}…`); break;
    case 's1_call':
      if (ev.phase === 'start') status(`${ev.model}: ${ev.questions} decisions (${ev.entities} × ${ev.questions / ev.entities} criteria)`, 1);
      else trace(s, 's1', `${ev.model} · ${ev.questions} noul decisions · ${ev.ms}ms`);
      break;
    case 'cells':
      ev.cells.forEach(c => {
        if (c.src === 'evidence') {
          setCell(c.e, c.c, {p: c.p, before: c.before, src: 'evidence', evidence: c.evidence, state: 'done', anim: (c.before * 100).toFixed(0)});
          render(); setTimeout(() => { setCell(c.e, c.c, {anim: null}); render(); }, 60);
          trace(s, 's1', `rescore ${esc(E[c.e]?.name)}: ${c.before.toFixed(2)} → <b>${c.p.toFixed(2)}</b> with evidence (${c.ms}ms)`);
        } else {
          setCell(c.e, c.c, {p: c.p, src: c.src, evidence: c.evidence || null, state: 'done', fresh: c.src === 'memory'});
          if (c.src === 'memory') setTimeout(() => { setCell(c.e, c.c, {fresh: false}); render(); }, 2500);
        }
      });
      render(); break;
    case 'gap': setCell(ev.e, ev.c, {state: 'gap', p: ev.p}); render(); status(`gap: unsure whether ${E[ev.e]?.name} fits (p=${ev.p.toFixed(2)})`, 1); break;
    case 'route':
      setCell(ev.e, ev.c, {state: 'route', probs: ev.probs, chosen: ev.chosen}); render();
      trace(s, 'bd', `route ${esc(E[ev.e]?.name)} → <b>${STRAT[ev.chosen]}</b> ${Object.entries(ev.probs).map(([k, v]) => `${STRAT[k]} ${v.toFixed(2)}`).join(' · ')} (${ev.model}, ${ev.ms}ms)`);
      break;
    case 'fetch': {
      const doing = ev.product === 'SERP API' ? (ev.note ? `finding ${E[ev.e]?.name}'s site` : `SERP API: ${ev.target}`) :
        ev.product === 'Web Unlocker' ? `reading ${host(ev.target)}` : `rendering ${host(ev.target)} in browser`;
      setTimeout(() => { setCell(ev.e, ev.c, {state: 'fetch', doing}); render(); }, 900);
      trace(s, 'bd', `${esc(ev.product)} → ${esc(ev.target)}`); status(`${ev.product}: ${ev.target}`, 1);
      break;
    }
    case 'evidence':
      if (ev.ok) { setCell(ev.e, ev.c, {calls: ev.calls}); trace(s, 'bd', `${esc(ev.product)} ✓ ${(ev.ms / 1000).toFixed(1)}s · ${(ev.bytes / 1024).toFixed(0)} KB · "${esc((ev.snippet || '').slice(0, 90))}…"`); }
      else { setCell(ev.e, ev.c, {state: 'gap'}); render(); trace(s, 'bd', `${esc(ev.product || ev.strategy)} ✗ ${ev.error ? esc(ev.error) : 'nothing relevant'} — escalating`); }
      break;
    case 'unresolved': setCell(ev.e, ev.c, {state: 'fail'}); render(); break;
    case 'graph': refreshGraph(); if (ev.op !== 'scored') trace(s, 'fk', `${ev.op} (${ev.ms}ms)<br><code>${esc(ev.cypher)}</code>`); else trace(s, 'fk', `wrote ${ev.n} SCORED edges (${ev.ms}ms)`); break;
    case 'done': busy = false; status(`done in ${(ev.ms / 1000).toFixed(1)}s`); break;
    case 'error': busy = false; status('error: ' + ev.text); trace(s, 'bd', 'error ' + esc(ev.text)); break;
  }
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; t0 = Date.now() / 1000;
  chat(esc(text), 'u'); $('#q').value = '';
  const res = await fetch('/api/turn', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({sid, text})});
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const {value, done} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    let i; while ((i = buf.indexOf('\n\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 2); if (line.startsWith('data: ')) handle(JSON.parse(line.slice(6))); }
  }
  busy = false;
}
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') send(e.target.value); });
$('#sugg').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') send(e.target.textContent); });
</script>
